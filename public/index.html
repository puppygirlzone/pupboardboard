<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>pupboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <canvas class="dot-grid" aria-hidden="true"></canvas>
    <div class="paws" aria-hidden="true"></div>
    <header class="topbar">
      <div class="hello">
        <div class="greeting"><svg class="greeting-paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="5.6" cy="9.4" rx="2.2" ry="2.9" transform="rotate(-18 5.6 9.4)"/><ellipse cx="9.6" cy="5.4" rx="2.2" ry="2.9" transform="rotate(-6 9.6 5.4)"/><ellipse cx="14.4" cy="5.4" rx="2.2" ry="2.9" transform="rotate(6 14.4 5.4)"/><ellipse cx="18.4" cy="9.4" rx="2.2" ry="2.9" transform="rotate(18 18.4 9.4)"/><path d="M12 11c-3.2 0-6 3.4-6 6.2 0 1.9 1.5 2.8 3.1 2.8 1.2 0 1.9-.6 2.9-.6s1.7.6 2.9.6c1.6 0 3.1-.9 3.1-2.8 0-2.8-2.8-6.2-6-6.2z"/></svg><span id="greeting">Hello</span></div>
        <div id="date" class="muted"></div>
      </div>
      <nav class="nav" aria-label="Pages">
        <span class="nav-indicator" aria-hidden="true"></span>
        <a href="#/">Overview</a>
        <a href="#/gaming">Gaming</a>
        <a href="#/music">Music</a>
        <a href="#/media">Media</a>
        <a href="#/news">News</a>
      </nav>
      <div class="meta">
        <div class="controls">
          <div class="menu-tray" id="menu-tray" hidden>
            <label class="theme-picker">
              <span class="visually-hidden">Colour theme</span>
              <select id="theme-select" aria-label="Colour theme"></select>
            </label>
            <button id="mode-toggle" class="mode-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode">
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <a class="settings-link" href="/setup.html" aria-label="Settings" title="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </a>
          </div>
          <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-tray" aria-label="Open menu" title="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line class="l1" x1="5" y1="7" x2="19" y2="7"/><line class="l2" x1="5" y1="12" x2="19" y2="12"/><line class="l3" x1="5" y1="17" x2="19" y2="17"/></svg>
          </button>
        </div>
        <div class="time-block">
          <div id="clock" class="clock">--:--</div>
          <div class="sync"><span id="sync-dot" class="sync-dot"></span><span id="sync-text" class="muted small">Connecting…</span></div>
        </div>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <noscript><p class="empty">This dashboard needs JavaScript enabled.</p></noscript>
  </body>
</html>
